name: Komga Recent Read Verify

on:
  push:
    branches:
      - feature/komga-recent-read-sort-v070

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run focused Komga tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests koharia.komga.api.KomgaApiSearchTest
          --tests koharia.komga.ui.library.KomgaSearchTypeTest
          --tests koharia.source.komga.KomgaFilterStateTest

      - name: Compile debug
        run: ./gradlew :app:compileDebugKotlin

      - name: Build parallel-install preview APK
        run: ./gradlew assemblePreview

      - name: Upload preview APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: komga-recent-read-preview-${{ github.sha }}
          if-no-files-found: error
          path: app/build/outputs/apk/**/*.apk
